name: Bug report
description: Something in ManwhaTrack doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: ManwhaTrack and Chrome versions
      placeholder: ManwhaTrack 1.0.0, Chrome 141
